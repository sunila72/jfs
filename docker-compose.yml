services:

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    expose:
      - "80"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: backend
    expose:
      - "9090:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

